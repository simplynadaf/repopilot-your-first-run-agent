<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RepoPilot: Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html,body { margin:0; background:#f5f5f5; }
  body { font-family:'Geist',sans-serif; color:#2d3142; padding:28px 32px; }
  .page { max-width:1000px; margin:0 auto; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:#7a6cff; margin:0; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:1.75rem; margin:6px 0 2px; }
  .sub { color:#4f5d75; font-size:.9rem; margin:0 0 16px; max-width:64ch; }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">RepoPilot · How It Works</p>
  <h1>From a repo URL to a friendly first-run guide</h1>
  <p class="sub">One Lambda function. The agent reads the real repo, runs seven tools and computes a 0-100 score, then asks Amazon Nova Pro to narrate one kind, ordered path.</p>

  <svg viewBox="0 0 920 560" role="img" aria-labelledby="rp-arch-title rp-arch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="rp-arch-title">RepoPilot architecture</title>
    <desc id="rp-arch-desc">A new contributor sends a repo URL to a web UI or Lambda Function URL; the RepoPilot agent on AWS Lambda fetches the public GitHub repo, runs five analysis tools, calls Amazon Nova Pro on Amazon Bedrock to narrate the result, and returns a friendly first-run guide.</desc>

    <defs>
      <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a6cff"/></marker>
    </defs>

    <rect width="920" height="560" fill="#f5f5f5"/>

    <!-- ============ ROW 1: the request flow (y ~ 60-120) ============ -->
    <!-- connectors first -->
    <!-- user -> UI -->
    <path d="M 196 92 H 268" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <rect x="206" y="72" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="234" y="81" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">REPO URL</text>
    <!-- UI -> Lambda -->
    <path d="M 404 92 H 476" stroke="#7a6cff" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
    <rect x="420" y="72" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="440" y="81" fill="#7a6cff" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">POST</text>

    <!-- user node -->
    <rect x="56" y="64" width="140" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
    <text x="126" y="88" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">🧑 New contributor</text>
    <text x="126" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">"get this running"</text>

    <!-- UI node -->
    <rect x="268" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <rect x="276" y="70" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width=".8"/>
    <text x="300" y="79" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">HTTPS</text>
    <text x="336" y="98" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">UI / Function URL</text>
    <text x="336" y="113" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">GitHub Pages demo</text>

    <!-- Lambda node (focal) -->
    <rect x="476" y="56" width="268" height="72" rx="8" fill="rgba(122,108,255,0.08)" stroke="#7a6cff" stroke-width="1.2"/>
    <rect x="486" y="64" width="78" height="13" rx="2" fill="transparent" stroke="rgba(122,108,255,0.5)" stroke-width=".8"/>
    <text x="525" y="74" fill="#5a4ad1" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">AWS LAMBDA</text>
    <text x="610" y="98" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">RepoPilot agent (py3.12)</text>
    <text x="610" y="115" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">fetch · score · narrate · reply</text>

    <!-- ============ ROW 2: downstream (y ~ 200-440) ============ -->
    <!-- Lambda -> GitHub (down-left elbow) -->
    <path d="M 540 128 V 170 Q 540 178 532 178 H 206 Q 198 178 198 186 V 212" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <rect x="300" y="172" width="90" height="12" rx="2" fill="#f5f5f5"/>
    <text x="345" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">FETCH REPO</text>

    <!-- Lambda -> Tools (straight down) -->
    <path d="M 610 128 V 212" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <rect x="572" y="162" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="610" y="171" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">RUN TOOLS</text>

    <!-- Lambda -> Bedrock (down-right elbow) -->
    <path d="M 700 128 V 170 Q 700 178 708 178 H 820 Q 828 178 828 186 V 212" stroke="#7a6cff" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
    <rect x="748" y="172" width="70" height="12" rx="2" fill="#f5f5f5"/>
    <text x="783" y="181" fill="#7a6cff" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">NARRATE</text>

    <!-- GitHub node -->
    <rect x="118" y="212" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
    <text x="198" y="236" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">🐙 Public GitHub</text>
    <text x="198" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">tree · README · manifests</text>

    <!-- Tools node -->
    <rect x="440" y="212" width="340" height="206" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <rect x="450" y="220" width="128" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width=".8"/>
    <text x="514" y="230" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">7 TOOLS → 0-100 SCORE</text>
    <text x="460" y="252" fill="#5a4ad1" font-size="11" font-weight="600">1 · assess_repo_trust</text>
    <text x="460" y="272" fill="#5a4ad1" font-size="11" font-weight="600">2 · scan_setup_for_danger</text>
    <text x="460" y="292" fill="#2d3142" font-size="11">3 · build_first_run_plan</text>
    <text x="460" y="312" fill="#2d3142" font-size="11">4 · check_readme_against_reality</text>
    <text x="460" y="332" fill="#2d3142" font-size="11">5 · generate_env_example</text>
    <text x="460" y="352" fill="#2d3142" font-size="11">6 · preflight_requirements</text>
    <text x="460" y="372" fill="#5a4ad1" font-size="11" font-weight="600">7 · explain_error  ★ the delight</text>
    <text x="460" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">weighted → Safety·Trust·Maint·Maturity·Docs</text>

    <!-- Bedrock node -->
    <rect x="748" y="212" width="160" height="56" rx="6" fill="rgba(122,108,255,0.08)" stroke="#7a6cff"/>
    <text x="828" y="236" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">🧠 Amazon Bedrock</text>
    <text x="828" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">Nova Pro</text>

    <!-- reply: Lambda back to user (dashed, clean down-and-left under row 1) -->
    <path d="M 476 110 H 440 Q 432 110 432 118 V 140 Q 432 148 424 148 L 40 148 Q 32 148 32 140 V 100 Q 32 92 40 92 L 54 92" stroke="#4f5d75" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#a)"/>
    <rect x="150" y="142" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="214" y="151" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">↩ FRIENDLY GUIDE</text>

    <!-- ============ legend ============ -->
    <line x1="56" y1="448" x2="864" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width=".8"/>
    <text x="56" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">LEGEND</text>
    <rect x="130" y="460" width="10" height="10" rx="2" fill="rgba(122,108,255,0.08)" stroke="#7a6cff"/>
    <text x="146" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">AWS service</text>
    <rect x="268" y="460" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142"/>
    <text x="284" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">agent / code</text>
    <rect x="420" y="460" width="10" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
    <text x="436" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">external</text>
    <line x1="548" y1="465" x2="578" y2="465" stroke="#7a6cff" stroke-width="1.6"/>
    <text x="586" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">model / HTTPS path</text>
    <line x1="720" y1="465" x2="750" y2="465" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="758" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">reply</text>
  </svg>
</div>
</body>
</html>
